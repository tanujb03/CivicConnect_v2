# CivicConnect local stack. From the repository root:
#   docker compose -f infra/compose/docker-compose.yml up -d --build                      # db + redis + backend
#   docker compose -f infra/compose/docker-compose.yml --profile s3 --profile scan --profile obs up -d --build
# Memory needs, ports and the verified state of every profile: docs/infra/COMPOSE.md. Only names are kept here; secrets live in the gitignored .env
# (pass it with --env-file .env so the variables below and the AI keys reach the containers).
name: civicconnect

services:
  db:
    image: civicconnect-postgres:local
    build:
      context: ../docker/postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_dev_pwd}
      POSTGRES_DB: civicconnect
    ports:
      - "${COMPOSE_DB_PORT:-5434}:5432"                        # not 5433/5432: those belong to civic-db (scripts/dev/db_up.ps1) and the host PostgreSQL service
    volumes:
      - pgdata:/var/lib/postgresql                             # PostgreSQL 18 keeps PGDATA under /var/lib/postgresql/<major>/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d civicconnect"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${COMPOSE_REDIS_PORT:-6380}:6379"                     # not 6379: civic-redis owns it
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  backend:
    image: civicconnect-backend:local
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      args:
        INSTALL_S3: ${INSTALL_S3:-0}                           # 1 = add boto3 (needed for STORAGE_BACKEND=s3, see the s3 profile)
    env_file:
      - path: ../../.env                                       # optional: AI keys / model ids; the values under environment: below win over it
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION_TO_A_SECURE_RANDOM_STRING}
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-civic_dev_pwd}@db:5432/civicconnect
      REDIS_URL: redis://redis:6379/0
      AI_GATEWAY_STORE: sql
      MEDIA_DIR: /data/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${API_PORT:-8000}}   # what a phone can reach: LAN address or the tunnel URL (docs/infra/TUNNEL.md)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
      S3_BUCKET: ${S3_BUCKET:-civicconnect-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-civicconnect}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-civic_s3_dev_key}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1g
    restart: unless-stopped

  # ---- profile s3: S3-compatible object store for STORAGE_BACKEND=s3. MinIO no longer publishes pullable images (docker.io/minio/minio does not exist, quay.io/minio is 401),
  # so SeaweedFS stands in; it speaks the same S3 API. Run with INSTALL_S3=1 STORAGE_BACKEND=s3 so the backend has boto3 and uses it.
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-volume.max=8", "-master.volumeSizeLimitMB=256"]
    ports:
      - "${COMPOSE_S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    restart: unless-stopped

  s3-init:
    profiles: ["s3"]
    image: amazon/aws-cli:latest
    entrypoint: ["sh", "-c"]
    command: ["aws --endpoint-url http://s3:8333 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb s3://$${S3_BUCKET}"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-civicconnect-evidence}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-civicconnect}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-civic_s3_dev_key}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  # ---- profile scan: ClamAV daemon (clamd on 3310). The first start downloads the signature database (needs internet) and loads it into memory.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:stable
    ports:
      - "${COMPOSE_CLAMD_PORT:-3310}:3310"
    volumes:
      - clamav-db:/var/lib/clamav                              # signatures survive restarts (the download is the slow part)
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    mem_limit: 3g
    restart: unless-stopped

  # ---- profile obs: Jaeger all-in-one (in-memory traces). OTLP gRPC 4317, OTLP HTTP 4318, UI http://localhost:16686
  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "16686:16686"
      - "${COMPOSE_OTLP_GRPC_PORT:-4317}:4317"
      - "${COMPOSE_OTLP_HTTP_PORT:-4318}:4318"
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
  media:
  s3data:
  clamav-db:
