# Repository-level pytest configuration: anchors rootdir at the repository root (so the root conftest.py always loads, whatever subset of tests is run).
# Run from the repository root:  python -m pytest ai backend -q
[pytest]
testpaths = ai backend
addopts = -ra
markers =
    requires_provider: needs live provider credentials (OPENAI_API_KEY + model env vars); skipped otherwise
    requires_kaggle: needs GPU / sentence-transformers / internet (Kaggle); skipped otherwise
    slow: executes notebooks end-to-end (tens of seconds)
